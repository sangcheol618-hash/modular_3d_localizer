modular_3d_localizer_node:
  ros__parameters:
    map_path: ""
    map_topic: map
    map_frame: map
    map_voxel_leaf_size: 0.5
    auto_adjust_voxel_leaf_size: false
    point_cloud_topic: ""
    base_frame: base_link
    lidar_frame: lidar
    lidar_voxel_leaf_size: 0.3
    scan_queue_depth: 1
    max_registration_rate_hz: 1.0
    localization_backend: fast_gicp
    initial_pose_topic: /initialpose
    estimated_pose_topic: localization_pose
    aligned_scan_topic: aligned_scan
    candidate_pose_topic: candidate_pose
    candidate_aligned_scan_topic: candidate_aligned_scan
    diagnostics_topic: localization_diagnostics
    motion_model: none
    odometry_topic: ""
    odom_frame: odom
    odometry_max_age_seconds: 0.5
    odometry_history_duration_seconds: 10.0
    tf_output_mode: map_to_base
    gicp_max_iterations: 20
    gicp_max_correspondence_distance: 3.0
    gicp_transformation_epsilon: 0.0001
    gicp_euclidean_fitness_epsilon: 0.001
    gicp_correspondence_randomness: 10
    coarse_gicp_voxel_leaf_size: 2.0
    coarse_gicp_max_correspondence_distance: 5.0
    coarse_gicp_max_iterations: 8
    fast_gicp_max_iterations: 20
    fast_gicp_max_correspondence_distance: 3.0
    fast_gicp_transformation_epsilon: 0.0001
    fast_gicp_correspondence_randomness: 10
    fast_gicp_num_threads: 0
    use_local_map: true
    local_map_radius: 30.0
    registration_max_fitness_score: 0.75
    registration_max_translation_jump_meters: 2.0
    registration_max_rotation_jump_radians: 0.523599
